name: openbkn

x-app-env: &app-env
  RDSHOST: mariadb
  RDSPORT: "3306"
  RDSDBNAME: openbkn
  RDSUSER: openbkn
  RDSPASS: ${MARIADB_PASSWORD}
  DB_TYPE: MariaDB
  OPENSEARCH_HOST: opensearch
  OPENSEARCH_PORT: "9200"
  OPENSEARCH_USER: ""
  OPENSEARCH_PASS: ""
  OPENSEARCHREAD: opensearch-read
  OPENSEARCHWRITE: opensearch-write
  REDISCLUSTERMODE: standalone
  REDISHOST: redis
  REDISPORT: "6379"
  REDISUSER: ""
  REDISPASS: ${REDIS_PASSWORD}
  KAFKAHOST: kafka
  KAFKAPORT: "9092"
  KAFKAUSER: ${KAFKA_USER:-openbkn}
  KAFKAPASS: ${KAFKA_PASSWORD}
  BKN_SAFE_URL: http://bkn-safe:3000

# Go 服务统一构建参数。用 "|" 分隔多个代理：任一代理出错（含 EOF/超时）就切下一个，
# 而 "," 只在 404/410 时才切换，遇到网络中断会直接失败。
x-go-build-args: &go-build-args
  GOPROXY_URL: ${GOPROXY_URL:-https://mirrors.aliyun.com/goproxy|https://goproxy.cn|https://mirrors.cloud.tencent.com/go|https://goproxy.io,direct}

services:
  # 把 config.template 按 .env 渲染到 config/，最终用户只需要编辑 .env。
  config-init:
    image: alpine:3.20
    # 离线栈：镜像必须来自本地导入，缺失时立刻报错而不是联网拉取。
    pull_policy: never
    env_file:
      - .env
    volumes:
      - ./config.template:/in:ro
      - ./config:/out
      - ./render-config.sh:/render-config.sh:ro
    entrypoint: ["/bin/sh", "/render-config.sh"]
    restart: "no"
    networks: [openbkn]

  mariadb:
    image: mariadb:11.4
    # 离线栈：镜像必须来自本地导入，缺失时立刻报错而不是联网拉取。
    pull_policy: never
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: openbkn
      MARIADB_USER: openbkn
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./mariadb-init.sql:/docker-entrypoint-initdb.d/10-openbkn.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      # 机械硬盘首次初始化数据目录可能超过 5 分钟，给足等待时间（约 13 分钟）。
      retries: 60
      start_period: 180s
    restart: unless-stopped
    networks: [openbkn]

  postgres:
    image: postgres:16
    # 离线栈：镜像必须来自本地导入，缺失时立刻报错而不是联网拉取。
    pull_policy: never
    environment:
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hydra
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydra -d hydra"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [openbkn]

  redis:
    image: redis:7.4
    # 离线栈：镜像必须来自本地导入，缺失时立刻报错而不是联网拉取。
    pull_policy: never
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [openbkn]

  kafka:
    image: ghcr.io/openbkn-ai/bitnami/kafka:3.9.0-debian-12-r10
    # 离线栈：镜像必须来自本地导入，缺失时立刻报错而不是联网拉取。
    pull_policy: never
    environment:
      KAFKA_KRAFT_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: CLIENT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: CLIENT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CLIENT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: CLIENT
      KAFKA_CFG_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CLIENT_USERS: ${KAFKA_USER:-openbkn}
      KAFKA_CLIENT_PASSWORDS: ${KAFKA_PASSWORD}
      KAFKA_INTER_BROKER_USER: ${KAFKA_USER:-openbkn}
      KAFKA_INTER_BROKER_PASSWORD: ${KAFKA_PASSWORD}
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/9092'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped
    networks: [openbkn]

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    # 离线栈：镜像必须来自本地导入，缺失时立刻报错而不是联网拉取。
    pull_policy: never
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    networks: [openbkn]

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    # 离线栈：镜像必须来自本地导入，缺失时立刻报错而不是联网拉取。
    pull_policy: never
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: sandbox-workspace,openbkn-objects
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [openbkn, sandbox_network]

  hydra-migrate:
    image: oryd/hydra:v26.2.0
    # 离线栈：镜像必须来自本地导入，缺失时立刻报错而不是联网拉取。
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://hydra:${POSTGRES_PASSWORD}@postgres:5432/hydra?sslmode=disable
    command: ["migrate", "sql", "-e", "--yes"]
    restart: "no"
    networks: [openbkn]

  hydra:
    image: oryd/hydra:v26.2.0
    # 离线栈：镜像必须来自本地导入，缺失时立刻报错而不是联网拉取。
    pull_policy: never
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    environment:
      DSN: postgres://hydra:${POSTGRES_PASSWORD}@postgres:5432/hydra?sslmode=disable
      URLS_SELF_ISSUER: ${OPENBKN_PUBLIC_BASE_URL}
      URLS_LOGIN: /login
      URLS_CONSENT: /consent
      URLS_DEVICE_VERIFICATION: ${OPENBKN_PUBLIC_BASE_URL}/device
      URLS_DEVICE_SUCCESS: ${OPENBKN_PUBLIC_BASE_URL}/device/success
      SECRETS_SYSTEM: ${HYDRA_SECRETS_SYSTEM}
      OAUTH2_EXPOSE_INTERNAL_ERRORS: "true"
      LOG_LEVEL: info
    command: ["serve", "all", "--dev"]
    restart: unless-stopped
    networks:
      openbkn:
        aliases: [bkn-safe-hydra-public, bkn-safe-hydra-admin]

  # Hydra 客户端不是由 bkn-safe 建库时自动注册的（对标 chart 里的 client-seed job）。
  # 缺这个客户端时 Studio 登录会报 invalid_client，并把用户带到 OAuth 错误页。
  hydra-client-seed:
    # 复用 bkn-safe 镜像（自带 curl 与 sh），避免为一次性任务再引入一个镜像。
    image: openbkn/bkn-safe:${OPENBKN_IMAGE_TAG:-local}
    # 离线栈：镜像必须来自本地导入，缺失时立刻报错而不是联网拉取。
    pull_policy: never
    depends_on:
      hydra: {condition: service_started}
    environment:
      HYDRA_ADMIN: http://bkn-safe-hydra-admin:4445
      WEB_BASE_URL: ${OPENBKN_PUBLIC_BASE_URL}
    volumes:
      - ./hydra-seed-client.sh:/seed.sh:ro
    entrypoint: ["/bin/sh", "/seed.sh"]
    restart: "no"
    networks: [openbkn]

  bkn-safe:
    image: openbkn/bkn-safe:${OPENBKN_IMAGE_TAG:-local}
    build:
      context: ../../bkn-foundry/bkn-safe
      dockerfile: Dockerfile
      args: *go-build-args
    depends_on:
      mariadb:
        condition: service_healthy
      hydra:
        condition: service_started
    environment:
      SAFE_HTTP_ADDR: ":3000"
      SAFE_SEED_ON_START: "true"
      SAFE_DB_TYPE: MySQL
      SAFE_DB_USER: openbkn
      SAFE_DB_PASSWORD: ${MARIADB_PASSWORD}
      SAFE_DB_HOST: mariadb
      SAFE_DB_PORT: "3306"
      SAFE_DB_NAME: safe
      SAFE_HYDRA_ADMIN_URL: http://bkn-safe-hydra-admin:4445
      SAFE_HYDRA_PUBLIC_URL: http://bkn-safe-hydra-public:4444
      SAFE_HYDRA_BROWSER_PUBLIC_URL: ${OPENBKN_PUBLIC_BASE_URL}
      SAFE_OAUTH_STUDIO_BASELINE_REDIRECT_URIS: '["${OPENBKN_PUBLIC_BASE_URL}/studio/callback"]'
      SAFE_BKN_BACKEND_BASE_URL: http://bkn-backend-svc:13014
      SAFE_BKN_AGENT_BASE_URL: http://bkn-agent:30800
      SAFE_EXECUTION_FACTORY_BASE_URL: http://agent-operator-integration:9000
      SAFE_VEGA_BACKEND_BASE_URL: http://vega-backend-svc:13014
      SAFE_ONTOLOGY_QUERY_BASE_URL: http://ontology-query-svc:13018
      BKN_SAFE_INITIAL_PASSWORD: ${BKN_SAFE_INITIAL_PASSWORD}
      GIN_MODE: release
    restart: unless-stopped
    networks: [openbkn]

  data-migrator:
    image: openbkn/data-migrator:${OPENBKN_IMAGE_TAG:-local}
    build:
      context: ../../bkn-foundry
      dockerfile: data-migrator/Dockerfile
      # 构建容器默认解析不了 host.docker.internal，git 走代理前必须先注入这条记录。
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        # archive.ubuntu.com 在国内会返回 502，apt 走阿里云。
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
        # 该服务要 git clone GitHub 上的 bkn-comm-py，只有国外流量走 Clash；
        # 国内镜像域名交给 NO_PROXY 直连（apt 已验证支持 no_proxy）。
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-http://host.docker.internal:7890}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-http://host.docker.internal:7890}
        NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1,.local,mirrors.aliyun.com,.aliyun.com,mirrors.cloud.tencent.com,.tencent.com}
    depends_on:
      config-init: {condition: service_completed_successfully}
      mariadb:
        condition: service_healthy
    command:
      - python3
      - server/data-migrator.py
      - migrate
      - --config
      - /app/config.yaml
      - --secret-config
      - /etc/data-migrator/secret-config.yaml
    volumes:
      - ./config/data-migrator-secret.yaml:/etc/data-migrator/secret-config.yaml:ro
    environment:
      TZ: Asia/Shanghai
      LANG: en_US.UTF-8
    restart: "no"
    networks: [openbkn]

  bkn-backend-svc:
    image: openbkn/bkn-backend:${OPENBKN_IMAGE_TAG:-local}
    build:
      context: ../../bkn-foundry
      dockerfile: adp/bkn/bkn-backend/docker/Dockerfile
      args: *go-build-args
    depends_on:
      config-init: {condition: service_completed_successfully}
      mariadb: {condition: service_healthy}
      kafka: {condition: service_healthy}
      opensearch: {condition: service_healthy}
      data-migrator: {condition: service_completed_successfully}
    environment:
      <<: *app-env
    volumes:
      - ./config/bkn-backend/bkn-backend-config.yaml:/opt/bkn-backend/config/bkn-backend-config.yaml:ro
      - ./config/dm-svc-conf/rds_conf.yaml:/tmp/rds_conf/rds_conf.yaml:ro
    restart: unless-stopped
    networks: [openbkn]

  ontology-query-svc:
    image: openbkn/ontology-query:${OPENBKN_IMAGE_TAG:-local}
    build:
      context: ../../bkn-foundry
      dockerfile: adp/bkn/ontology-query/docker/Dockerfile
      args: *go-build-args
    depends_on:
      config-init: {condition: service_completed_successfully}
      mariadb: {condition: service_healthy}
      opensearch: {condition: service_healthy}
      data-migrator: {condition: service_completed_successfully}
    environment:
      <<: *app-env
    volumes:
      - ./config/ontology-query/ontology-query-config.yaml:/opt/ontology-query/config/ontology-query-config.yaml:ro
      - ./config/dm-svc-conf/rds_conf.yaml:/tmp/rds_conf/rds_conf.yaml:ro
    restart: unless-stopped
    networks: [openbkn]

  vega-backend-svc:
    image: openbkn/vega-backend:${OPENBKN_IMAGE_TAG:-local}
    build:
      # 与 CI 一致：上下文为 server 目录，Dockerfile 用 COPY . . 读取 server/ 下的源码。
      context: ../../bkn-foundry/vega/vega-backend/server
      dockerfile: ../docker/Dockerfile
      args: *go-build-args
    depends_on:
      config-init: {condition: service_completed_successfully}
      mariadb: {condition: service_healthy}
      kafka: {condition: service_healthy}
      opensearch: {condition: service_healthy}
      data-migrator: {condition: service_completed_successfully}
    environment:
      <<: *app-env
    volumes:
      - ./config/vega-backend/vega-backend-config.yaml:/opt/vega-backend/config/vega-backend-config.yaml:ro
      - ./config/dm-svc-conf/rds_conf.yaml:/tmp/rds_conf/rds_conf.yaml:ro
    restart: unless-stopped
    networks: [openbkn]

  mf-model-api:
    image: openbkn/mf-model-api:${OPENBKN_IMAGE_TAG:-local}
    build:
      context: ../../bkn-foundry/infra/mf-model-api
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    depends_on:
      config-init: {condition: service_completed_successfully}
      mariadb: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      opensearch: {condition: service_healthy}
      data-migrator: {condition: service_completed_successfully}
    environment:
      <<: *app-env
      DEVICE_CODE: ""
      DIRECTORY_PROVIDER: bkn-safe
      BKN_SAFE_URL: http://bkn-safe:3000
      OAUTHPUBLICHOST: bkn-safe-hydra-public
      OAUTHPUBLICPORT: "4444"
      OAUTHADMINHOST: bkn-safe-hydra-admin
      OAUTHADMINPORT: "4445"
    volumes:
      - ./config/dm-svc-conf:/tmp/rds_conf:ro
    restart: unless-stopped
    networks: [openbkn]

  mf-model-manager:
    image: openbkn/mf-model-manager:${OPENBKN_IMAGE_TAG:-local}
    build:
      context: ../../bkn-foundry/infra/mf-model-manager
      dockerfile: Dockerfile
    depends_on:
      config-init: {condition: service_completed_successfully}
      mariadb: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      opensearch: {condition: service_healthy}
      data-migrator: {condition: service_completed_successfully}
    environment:
      <<: *app-env
      DEVICE_CODE: ""
      DIRECTORY_PROVIDER: bkn-safe
      BKN_SAFE_URL: http://bkn-safe:3000
      OAUTHPUBLICHOST: bkn-safe-hydra-public
      OAUTHPUBLICPORT: "4444"
      OAUTHADMINHOST: bkn-safe-hydra-admin
      OAUTHADMINPORT: "4445"
    volumes:
      - ./config/dm-svc-conf:/tmp/rds_conf:ro
    restart: unless-stopped
    networks: [openbkn]

  agent-retrieval:
    image: openbkn/agent-retrieval:${OPENBKN_IMAGE_TAG:-local}
    build:
      # Dockerfile 里的 COPY 使用仓库根相对路径，因此上下文必须是 bkn-foundry 根目录。
      context: ../../bkn-foundry
      dockerfile: adp/context-loader/agent-retrieval/docker/Dockerfile
      args: *go-build-args
    depends_on:
      config-init: {condition: service_completed_successfully}
      mariadb: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      data-migrator: {condition: service_completed_successfully}
      bkn-safe: {condition: service_started}
    environment:
      BKN_TRACE_EVIDENCE_INGEST_TOKEN: ${BKN_TRACE_EVIDENCE_INGEST_TOKEN}
      BKN_TRACE_ARTIFACT_INGEST_TOKEN: ${BKN_TRACE_ARTIFACT_INGEST_TOKEN}
      BKN_PROVENANCE_BOOTSTRAP_TOKEN: ${BKN_PROVENANCE_BOOTSTRAP_TOKEN}
      BKN_TRACE_EVIDENCE_PUBLISHER_ENABLED: "false"
    volumes:
      - ./config/agent-retrieval:/sysvol/config:ro
      - ./config/agent-retrieval/agent-retrieval-secret.yaml:/sysvol/secret/agent-retrieval-secret.yaml:ro
    restart: unless-stopped
    networks: [openbkn, sandbox_network]

  agent-operator-integration:
    image: openbkn/agent-operator-integration:${OPENBKN_IMAGE_TAG:-local}
    build:
      # 同上：Dockerfile 使用仓库根相对路径 COPY。
      context: ../../bkn-foundry
      dockerfile: adp/execution-factory/operator-integration/docker/Dockerfile
      args:
        <<: *go-build-args
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
    depends_on:
      config-init: {condition: service_completed_successfully}
      mariadb: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      data-migrator: {condition: service_completed_successfully}
      bkn-safe: {condition: service_started}
      minio: {condition: service_healthy}
    environment:
      BKN_TRACE_EVIDENCE_INGEST_TOKEN: ${BKN_TRACE_EVIDENCE_INGEST_TOKEN}
      BKN_TRACE_ARTIFACT_INGEST_TOKEN: ${BKN_TRACE_ARTIFACT_INGEST_TOKEN}
      BKN_PROVENANCE_BOOTSTRAP_TOKEN: ${BKN_PROVENANCE_BOOTSTRAP_TOKEN}
      BKN_TRACE_EVIDENCE_PUBLISHER_ENABLED: "false"
      # 服务启动时强制校验，缺失会直接 panic。
      BKN_SAFE_URL: http://bkn-safe:3000
    volumes:
      - ./config/agent-operator-integration:/sysvol/config:ro
      - ./config/agent-operator-integration/agent-operator-integration-secret.yaml:/sysvol/secret/agent-operator-integration-secret.yaml:ro
    restart: unless-stopped
    networks: [openbkn]

  oss-gateway-backend:
    image: openbkn/oss-gateway-backend:${OPENBKN_IMAGE_TAG:-local}
    build:
      context: ../../bkn-foundry/infra/oss-gateway-backend
      dockerfile: Dockerfile
      args:
        # 该 Dockerfile 的参数名是 GOPROXY（不是 GOPROXY_URL）。
        GOPROXY: ${GOPROXY:-https://mirrors.aliyun.com/goproxy|https://goproxy.cn|https://mirrors.cloud.tencent.com/go|https://goproxy.io,direct}
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
    depends_on:
      mariadb: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      data-migrator: {condition: service_completed_successfully}
    environment:
      <<: *app-env
      CRYPTO_AES_KEY: ${OSS_CRYPTO_AES_KEY}
    restart: unless-stopped
    networks: [openbkn]

  bkn-agent:
    image: openbkn/bkn-agent:${OPENBKN_IMAGE_TAG:-local}
    build:
      context: ../../bkn-foundry/infra/bkn-agent
      dockerfile: Dockerfile
      args:
        # 腾讯云镜像批量下载会频繁 RemoteDisconnected；阿里云实测 3/3 成功且已同步 aiohttp 3.14.5。
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    depends_on:
      config-init: {condition: service_completed_successfully}
      mariadb: {condition: service_healthy}
      data-migrator: {condition: service_completed_successfully}
      bkn-safe: {condition: service_started}
    environment:
      BKN_TRACE_EVIDENCE_INGEST_TOKEN: ${BKN_TRACE_EVIDENCE_INGEST_TOKEN}
      BKN_TRACE_ARTIFACT_INGEST_TOKEN: ${BKN_TRACE_ARTIFACT_INGEST_TOKEN}
      BKN_PROVENANCE_BOOTSTRAP_TOKEN: ${BKN_PROVENANCE_BOOTSTRAP_TOKEN}
      BKN_AGENT_PORT: "30800"
      RDSHOST: mariadb
      RDSPORT: "3306"
      RDSDBNAME: openbkn
      RDSUSER: openbkn
      RDSPASS: ${MARIADB_PASSWORD}
      HYDRA_ADMIN_BASE: http://bkn-safe-hydra-admin:4445
      BKN_SAFE_BASE: http://bkn-safe:3000/api/safe/v1
      MF_MODEL_API_PRIVATE_BASE: http://mf-model-api:9898
      OPERATOR_INTEGRATION_BASE: http://agent-operator-integration:9000
      CONTEXT_LOADER_MCP_URL: http://agent-retrieval:30780/api/agent-retrieval/v1/mcp/
      CHECKPOINTER_BACKEND: mysql
      CHECKPOINTER_ALLOW_RUNTIME_DDL: "true"
      OTEL_ENABLED: "false"
      OTEL_LOGS_ENABLED: "false"
      BKN_TRACE_ARTIFACT_INGEST_URL: http://agent-observability:8080/api/agent-observability/v1/evidence/artifacts
    volumes:
      - ./config/dm-svc-conf:/tmp/rds_conf:ro
    restart: unless-stopped
    networks: [openbkn]

  agent-observability:
    image: openbkn/agent-observability:${OPENBKN_IMAGE_TAG:-local}
    build:
      context: ../../bkn-foundry/bkn-trace/agent-observability
      dockerfile: Dockerfile
      args: *go-build-args
    environment:
      BKN_TRACE_EVIDENCE_INGEST_TOKEN: ${BKN_TRACE_EVIDENCE_INGEST_TOKEN}
      BKN_TRACE_ARTIFACT_INGEST_TOKEN: ${BKN_TRACE_ARTIFACT_INGEST_TOKEN}
      BKN_PROVENANCE_BOOTSTRAP_TOKEN: ${BKN_PROVENANCE_BOOTSTRAP_TOKEN}
      BKN_TRACE_LOG_LEVEL: info
      BKN_TRACE_EVIDENCE_STORE: memory
      BKN_TRACE_CORE_STORE: mariadb
      BKN_TRACE_CORE_AUTO_MIGRATE: "true"
      BKN_TRACE_CORE_MARIADB_DSN: openbkn:${MARIADB_PASSWORD}@tcp(mariadb:3306)/bkn_trace?parseTime=true
      BKN_TRACE_ALLOW_UNAUTHENTICATED_INGEST: "false"
      BKN_TRACE_ALLOW_UNAUTHENTICATED_QUERY: "false"
      BKN_TRACE_HYDRA_ADMIN_URL: http://bkn-safe-hydra-admin:4445
      BKN_SAFE_BASE_URL: http://bkn-safe:3000
      BKN_TRACE_BKN_RESOLVER_URL: http://bkn-backend-svc:13014
      BKN_TRACE_VEGA_RESOLVER_URL: http://vega-backend-svc:13014
      BKN_TRACE_EXECUTION_FACTORY_URL: http://agent-operator-integration:9000
      BKN_TRACE_MODEL_MANAGER_URL: http://mf-model-manager:9898
      OPENSEARCH_ENDPOINT: http://opensearch:9200
      OPENSEARCH_AUTH_ENABLED: "false"
    depends_on:
      config-init: {condition: service_completed_successfully}
      mariadb: {condition: service_healthy}
      bkn-safe: {condition: service_started}
    restart: unless-stopped
    networks: [openbkn]

  sandbox-control-plane:
    image: openbkn/sandbox-control-plane:${OPENBKN_IMAGE_TAG:-local}
    build:
      context: ../../bkn-foundry/infra/sandbox
      dockerfile: sandbox_control_plane/Dockerfile
      args:
        # 启用 Dockerfile 内置的 apt/pip 国内镜像分支。
        USE_MIRROR: "true"
        # USTC 的 Debian 源构建时返回 502；apt 走阿里云，PyPI 走腾讯云。
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
        PIP_MIRROR: ${PIP_MIRROR:-mirrors.cloud.tencent.com}
    depends_on:
      mariadb: {condition: service_healthy}
      minio: {condition: service_healthy}
    environment:
      PYTHONUNBUFFERED: "1"
      ENVIRONMENT: development
      DEBUG: "false"
      DATABASE_URL: mysql+aiomysql://openbkn:${MARIADB_PASSWORD}@mariadb:3306/sandbox
      DB_TYPE: mariadb
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_USER: openbkn
      DB_PASSWORD: ${MARIADB_PASSWORD}
      DB_DATABASE: sandbox
      DOCKER_HOST: unix:///var/run/docker.sock
      CONTROL_PLANE_URL: http://sandbox-control-plane:8000
      EXECUTOR_PORT: "8080"
      DEFAULT_TIMEOUT: "300"
      MAX_TIMEOUT: "3600"
      WARM_POOL_ENABLED: "false"
      DISABLE_BWRAP: "true"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: sandbox-workspace
      S3_REGION: us-east-1
      BKN_BASE_URL: http://gateway
      BKN_SANDBOX_MCP_URL: http://agent-retrieval:30780/api/agent-retrieval/v1/mcp/
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks: [openbkn, sandbox_network]

  studio:
    image: openbkn/studio:${OPENBKN_IMAGE_TAG:-local}
    build:
      context: ../../bkn-studio
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
    depends_on:
      config-init: {condition: service_completed_successfully}
    volumes:
      - ./config/studio-config.js:/usr/share/nginx/html/studio/config.js:ro
    restart: unless-stopped
    networks: [openbkn]

  gateway:
    image: nginx:1.27-alpine
    # 离线栈：镜像必须来自本地导入，缺失时立刻报错而不是联网拉取。
    pull_policy: never
    depends_on:
      bkn-safe: {condition: service_started}
      bkn-backend-svc: {condition: service_started}
      ontology-query-svc: {condition: service_started}
      vega-backend-svc: {condition: service_started}
      mf-model-api: {condition: service_started}
      mf-model-manager: {condition: service_started}
      agent-retrieval: {condition: service_started}
      agent-operator-integration: {condition: service_started}
      agent-observability: {condition: service_started}
      bkn-agent: {condition: service_started}
      studio: {condition: service_started}
    ports:
      - "${OPENBKN_BIND_ADDRESS:-127.0.0.1}:${OPENBKN_HTTP_PORT:-8080}:80"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy-headers.conf:/etc/nginx/conf.d/proxy-headers.conf:ro
    restart: unless-stopped
    networks:
      openbkn:
        aliases: [gateway]
      sandbox_network:
        aliases: [gateway]

networks:
  openbkn:
    name: openbkn_network
    driver: bridge
  sandbox_network:
    name: sandbox_network
    driver: bridge

volumes:
  mariadb-data:
  postgres-data:
  redis-data:
  kafka-data:
  opensearch-data:
  minio-data:
