    port: 6379
    masterHost: ''
    masterPort: 0
    slaveHost: ''
    slavePort: 0
    sentinelHost: ''
    sentinelPort: 0
    sentinelUsername: ''
    sentinelPassword: ''
    masterGroupName: ''
