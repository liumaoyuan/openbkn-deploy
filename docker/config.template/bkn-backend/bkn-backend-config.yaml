# 本文件由 config-init 根据 docker/.env 渲染生成，请勿手工修改；改值请修改 docker/.env 后重新 up。
# 如需改值请修改 docker/.env 后重启: docker compose --env-file .env up -d
server:
  runMode: release
  httpPort: 13014
  language: zh-CN
  readTimeOut: 600
  writeTimeOut: 600
  defaultSmallModelName: ''
  defaultSmallModelEnabled: false
  proxySyncWorkerEnabled: true
  proxySyncWorkerCount: 4
  proxySyncPollInterval: 1
  proxySyncLeaseSeconds: 60
  proxySyncMaxAttempts: 12
  proxyOutboxCleanupInterval: 3600
log:
  logLevel: debug
  developMode: false
  maxAge: 100
  maxBackups: 20
  maxSize: 100
otel:
  service_name: bkn-backend
  environment: production
  otlp_endpoint: otelcol-contrib:4318
  trace:
    enabled: false
    sampling_rate: 1.0
  log:
    enabled: false
    level: info
depServices:
  class-443:
    ingressClass: class-443
  rds:
    host: mariadb
    port: 3306
    user: openbkn
    password: ${MARIADB_PASSWORD}
    type: MariaDB
  mq:
    mqType: kafka
    mqHost: kafka
    mqPort: 9092
    protocol: sasl_plaintext
    tenant: default
    auth:
      username: openbkn
      password: ${KAFKA_PASSWORD}
      mechanism: PLAIN
  opensearch:
    host: opensearch
    port: 9200
    protocol: http
    user: admin
    password: ${OPENSEARCH_PASSWORD}
  hydra-admin:
    host: bkn-safe-hydra-admin
    port: 4445
    protocol: http
  mf-model-manager:
    host: mf-model-manager
    port: 9898
    protocol: http
  mf-model-api:
    host: mf-model-api
    port: 9898
    protocol: http
  ontology-query:
    host: ontology-query-svc
    port: 13018
    protocol: http
  vega-backend:
    host: vega-backend-svc
    port: 13014
    protocol: http
  agent-operator-integration:
    host: agent-operator-integration
    port: 9000
    protocol: http
