# 本文件由 config-init 根据 docker/.env 渲染生成，请勿手工修改；改值请修改 docker/.env 后重新 up。
# 如需改值请修改 docker/.env 后重启: docker compose --env-file .env up -d
server:
  runMode: release
  httpPort: 13018
  language: zh-CN
  readTimeOut: 120
  writeTimeOut: 120
  viewDataTimeout: 5m
  defaultSmallModelEnabled: true
  filteredCrossJoinMaxEdgeExpand: 10000
log:
  logLevel: debug
  developMode: false
  maxAge: 100
  maxBackups: 20
  maxSize: 100
otel:
  service_name: ontology-query
  environment: production
  otlp_endpoint: otelcol-contrib:4318
  trace:
    enabled: true
    sampling_rate: 1.0
  log:
    enabled: true
    level: info
depServices:
  class-443:
    ingressClass: class-443
  rds:
    host: mariadb
    port: 3306
    user: openbkn
    password: ${MARIADB_PASSWORD}
    type: MariaDB
  opensearch:
    host: opensearch
    port: 9200
    protocol: http
    user: admin
    password: ${OPENSEARCH_PASSWORD}
  authorization-private:
    host: bkn-safe
    port: 3000
    protocol: http
  user-management:
    host: bkn-safe
    port: 3000
    protocol: http
  hydra-public:
    host: bkn-safe-hydra-public
    port: 4444
    protocol: http
  hydra-admin:
    host: bkn-safe-hydra-admin
    port: 4445
    protocol: http
  model-factory:
    host: mf-model-api
    port: 9898
    protocol: http
  vega-backend:
    host: vega-backend-svc
    port: 13014
    protocol: http
  bkn-backend:
    host: bkn-backend-svc
    port: 13014
    protocol: http
  agent-operator-integration:
    host: agent-operator-integration
    port: 9000
    protocol: http
  mf-model-manager:
    host: mf-model-manager
    port: 9898
    protocol: http
  mf-model-api:
    host: mf-model-api
    port: 9898
    protocol: http
