# 本文件由 config-init 根据 docker/.env 渲染生成，请勿手工修改；改值请修改 docker/.env 后重新 up。
# 如需改值请修改 docker/.env 后重启: docker compose --env-file .env up -d
server:
  runMode: release
  httpPort: 13014
  language: zh-CN
  readTimeOut: 600
  writeTimeOut: 600
log:
  logLevel: debug
  developMode: false
  maxAge: 100
  maxBackups: 20
  maxSize: 100
otel:
  service_name: vega-backend
  environment: production
  otlp_endpoint: otelcol-contrib:4318
  trace:
    enabled: false
    sampling_rate: 1.0
  log:
    enabled: false
    level: info
crypto:
  enabled: false
  privateKeyPath: /opt/vega-backend/secret-config/rsa_private_key_pkcs8.pem
  publicKeyPath: /opt/vega-backend/secret-config/rsa_public_key.pem
depServices:
  class-443:
    ingressClass: class-443
  rds:
    host: mariadb
    port: 3306
    user: openbkn
    password: ${MARIADB_PASSWORD}
    type: MariaDB
  mq:
    mqType: kafka
    mqHost: kafka
    mqPort: 9092
    protocol: sasl_plaintext
    tenant: default
    auth:
      username: openbkn
      password: ${KAFKA_PASSWORD}
      mechanism: PLAIN
  opensearch:
    host: opensearch
    port: 9200
    protocol: http
    user: admin
    password: ${OPENSEARCH_PASSWORD}
  hydra-admin:
    host: bkn-safe-hydra-admin
    port: 4445
    protocol: http
  kafka-connect:
    host: kafka-connect
    port: 8083
    protocol: http
  mf-model-manager:
    host: mf-model-manager
    port: 9898
    protocol: http
  mf-model-api:
    host: mf-model-api
    port: 9898
    protocol: http
  bkn-agent:
    host: bkn-agent
    port: 30800
    protocol: http
rateLimiting:
  concurrency:
    enabled: false
    global:
      max_concurrent_queries: 10
query:
  cursorMaxSessions: 1000
  cursorMaxSessionsPerAccount: 100
indexCleanup:
  workerEnabled: true
  interval: 1h
  protectionPeriod: 24h
  maxDeletesPerRun: 100
  dryRun: true
taskWorker:
  semanticWorkerCount: 1
  discoverWorkerCount: 1
  batchWorkerCount: 1
  streamingWorkerCount: 1
