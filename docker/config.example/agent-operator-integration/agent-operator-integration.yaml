# 手工维护的运行时配置：把 CHANGE_ME_* 替换成 docker/.env 中同名变量的值。
# 修改后重启对应服务: docker compose --env-file .env restart <service>
project:
  language: zh-CN
  host: 0.0.0.0
  port: 9000
  logger_level: 0
  name: agent-operator-integration
  pod_id: docker-compose
  machine_id: ''
  debug: false
operator:
  import_file_size_limit: 100000000
  import_operator_max_count: 10
  operator_description_length_limit: 500
mcp:
  conn_timeout: 10
  max_instances: 200
  instance_ttl: 1800
  cleanup_interval: 60
category:
  init_switch: true
proxy_module:
  default_timeout: 30
  max_timeout: 120
  min_timeout: 1
  max_clients: 100
  client_lifetime: 300
oauth:
  public_host: bkn-safe-hydra-public
  public_port: 4444
  public_protocol: http
  admin_host: bkn-safe-hydra-admin
  admin_port: 4445
  admin_protocol: http
  admin_prefix: /admin
agent-operator-app:
  private_host: agent-operator-integration
  private_port: 9000
  private_protocol: http
mf-model-api:
  private_host: mf-model-api
  private_port: 9898
  private_protocol: http
mf-model-manager:
  private_host: mf-model-manager
  private_port: 9898
  private_protocol: http
db:
  conn_timeout: 30
  read_timeout: 30
  write_timeout: 30
  max_open_conns: 30
  system_id: ''
business-system-service:
  private_host: business-system-service.openbkn
  private_port: 80
  private_protocol: http
sandbox-control-plane:
  private_host: sandbox-control-plane
  private_port: 8000
  private_protocol: http
  template_id: ''
  session_resources:
    cpu: 1
    memory: 512Mi
    disk: 1Gi
    timeout: 3600
  max_sessions: 3
  active_sessions: 1
  max_concurrent_tasks: 100
vega-backend:
  private_host: vega-backend-svc
  private_port: 13014
  private_protocol: http
redis:
  connectType: standalone
  enableSSL: false
  secretName: ''
  caName: ''
  certName: ''
  keyName: ''
  poolSize: 10
ai_generation_config:
  python_function_generator_prompt_id: ''
  metadata_param_generator_prompt_id: ''
  llm:
    model: ''
    max_tokens: 1024
    temperature: 0.1
    top_k: 20
    top_p: 0.1
    frequency_penalty: 0.1
    presence_penalty: 0.1
oss-gateway-backend:
  private_host: oss-gateway-backend
  private_port: 8080
  private_protocol: http
  storage_id: ''
  internal_request: false
  expires: 3600
pypi:
  trusted_index_urls:
  - https://pypi.org/simple
