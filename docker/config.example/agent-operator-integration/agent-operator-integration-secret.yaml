# 手工维护的运行时配置：把 CHANGE_ME_* 替换成 docker/.env 中同名变量的值。
# 修改后重启对应服务: docker compose --env-file .env restart <service>
db:
  host: mariadb
  port: 3306
  user_name: openbkn
  password: CHANGE_ME_MARIADB_PASSWORD
  db_name: openbkn
  charset: utf8mb4
redis:
  connectInfo:
    username: ''
    password: CHANGE_ME_REDIS_PASSWORD
    host: redis
    port: 6379
    masterHost: ''
    masterPort: 0
    slaveHost: ''
    slavePort: 0
    sentinelHost: ''
    sentinelPort: 0
    sentinelUsername: ''
    sentinelPassword: ''
    masterGroupName: ''
