# 手工维护的运行时配置：把 CHANGE_ME_* 替换成 docker/.env 中同名变量的值。
# 修改后重启对应服务: docker compose --env-file .env restart <service>
service_name: agent-retrieval
service_version: 1.0.0
environment: production
otlp_endpoint: http://agent-observability:8080
trace:
  enabled: false
  sampling_rate: 1.0
log:
  enabled: false
  level: info
