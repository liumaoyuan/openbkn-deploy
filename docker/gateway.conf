server {
    listen 80;
    server_name _;
    client_max_body_size 500m;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
    location = / {
        return 302 /studio/;
    }

    location /api/bkn-backend/v1 { proxy_pass http://bkn-backend-svc:13014; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/bkn-backend/v2 { proxy_pass http://bkn-backend-svc:13014; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/ontology-manager/v1 { proxy_pass http://bkn-backend-svc:13014; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/ontology-query/v1 { proxy_pass http://ontology-query-svc:13018; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/ontology-query/v2 { proxy_pass http://ontology-query-svc:13018; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/vega-backend/v1 { proxy_pass http://vega-backend-svc:13014; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/agent-retrieval/v1 { proxy_pass http://agent-retrieval:30779; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/agent-operator-integration/v1 { proxy_pass http://agent-operator-integration:9000; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/capabilities-lab/v1 { proxy_pass http://agent-operator-integration:9000; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/agent-observability/v1 { proxy_pass http://agent-observability:8080; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/observability/v1 { proxy_pass http://agent-observability:8080; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/mf-model-api { proxy_pass http://mf-model-api:9898; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/mf-model-manager { proxy_pass http://mf-model-manager:9898; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/bkn-agent/v1/metric-design/executions { proxy_pass http://bkn-agent:30800; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/bkn-agent/v1/executions { proxy_pass http://bkn-agent:30800; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/bkn-agent/v1/me/agents { proxy_pass http://bkn-agent:30800; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/bkn-agent/v1/networks { proxy_pass http://bkn-agent:30800; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/bkn-agent/v1/admin/agents { proxy_pass http://bkn-agent:30800; include /etc/nginx/conf.d/proxy-headers.conf; }

    location /login { proxy_pass http://bkn-safe:3000; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /consent { proxy_pass http://bkn-safe:3000; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /device { proxy_pass http://bkn-safe:3000; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /change-password { proxy_pass http://bkn-safe:3000; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/safe/v1/auth/change-password { proxy_pass http://bkn-safe:3000; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/safe/v1/admin { proxy_pass http://bkn-safe:3000; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/safe/v1/me { proxy_pass http://bkn-safe:3000; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/safe/v1/permission-requests { proxy_pass http://bkn-safe:3000; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /api/safe/v1/capabilities { proxy_pass http://bkn-safe:3000; include /etc/nginx/conf.d/proxy-headers.conf; }

    location /oauth2 { proxy_pass http://bkn-safe-hydra-public:4444; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /.well-known/openid-configuration { proxy_pass http://bkn-safe-hydra-public:4444; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /.well-known/jwks.json { proxy_pass http://bkn-safe-hydra-public:4444; include /etc/nginx/conf.d/proxy-headers.conf; }
    location /userinfo { proxy_pass http://bkn-safe-hydra-public:4444; include /etc/nginx/conf.d/proxy-headers.conf; }

    # 运行时配置必须不缓存，否则改了 mode 后浏览器仍用旧配置。
    location = /studio/config.js {
        proxy_pass http://studio:80;
        include /etc/nginx/conf.d/proxy-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /studio/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        proxy_pass http://studio:80;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /studio/ {
        proxy_pass http://studio:80;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
}
