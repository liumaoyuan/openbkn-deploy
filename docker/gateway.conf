server {
    listen 80;
    server_name _;
    client_max_body_size 500m;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # 用 Docker 内置 DNS 动态解析上游：容器 IP 变化后最多 10 秒自动生效，
    # 避免主机重启后 nginx 仍指向旧 IP 导致后端 502。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
    location = / {
        return 302 /studio/;
    }

    location /api/bkn-backend/v1 {
        set $up_bkn_backend http://bkn-backend-svc:13014;
        proxy_pass $up_bkn_backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /api/bkn-backend/v2 {
        set $up_bkn_backend http://bkn-backend-svc:13014;
        proxy_pass $up_bkn_backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /api/ontology-manager/v1 {
        set $up_bkn_backend http://bkn-backend-svc:13014;
        proxy_pass $up_bkn_backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /api/ontology-query/v1 {
        set $up_ontology_query http://ontology-query-svc:13018;
        proxy_pass $up_ontology_query;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /api/ontology-query/v2 {
        set $up_ontology_query http://ontology-query-svc:13018;
        proxy_pass $up_ontology_query;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /api/vega-backend/v1 {
        set $up_vega http://vega-backend-svc:13014;
        proxy_pass $up_vega;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /api/agent-retrieval/v1 {
        set $up_agent_retrieval http://agent-retrieval:30779;
        proxy_pass $up_agent_retrieval;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /api/agent-operator-integration/v1 {
        set $up_operator http://agent-operator-integration:9000;
        proxy_pass $up_operator;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /api/capabilities-lab/v1 {
        set $up_operator http://agent-operator-integration:9000;
        proxy_pass $up_operator;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /api/agent-observability/v1 {
        set $up_observability http://agent-observability:8080;
        proxy_pass $up_observability;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /api/observability/v1 {
        set $up_observability http://agent-observability:8080;
        proxy_pass $up_observability;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /api/mf-model-api {
        set $up_mf_model_api http://mf-model-api:9898;
        proxy_pass $up_mf_model_api;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /api/mf-model-manager {
        set $up_mf_model_manager http://mf-model-manager:9898;
        proxy_pass $up_mf_model_manager;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /api/bkn-agent/v1/metric-design/executions {
        set $up_bkn_agent http://bkn-agent:30800;
        proxy_pass $up_bkn_agent;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /api/bkn-agent/v1/executions {
        set $up_bkn_agent http://bkn-agent:30800;
        proxy_pass $up_bkn_agent;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /api/bkn-agent/v1/me/agents {
        set $up_bkn_agent http://bkn-agent:30800;
        proxy_pass $up_bkn_agent;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /api/bkn-agent/v1/networks {
        set $up_bkn_agent http://bkn-agent:30800;
        proxy_pass $up_bkn_agent;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /api/bkn-agent/v1/admin/agents {
        set $up_bkn_agent http://bkn-agent:30800;
        proxy_pass $up_bkn_agent;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    location /login {
        set $up_bkn_safe http://bkn-safe:3000;
        proxy_pass $up_bkn_safe;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /consent {
        set $up_bkn_safe http://bkn-safe:3000;
        proxy_pass $up_bkn_safe;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /device {
        set $up_bkn_safe http://bkn-safe:3000;
        proxy_pass $up_bkn_safe;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /change-password {
        set $up_bkn_safe http://bkn-safe:3000;
        proxy_pass $up_bkn_safe;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /api/safe/v1/auth/change-password {
        set $up_bkn_safe http://bkn-safe:3000;
        proxy_pass $up_bkn_safe;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /api/safe/v1/admin {
        set $up_bkn_safe http://bkn-safe:3000;
        proxy_pass $up_bkn_safe;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /api/safe/v1/me {
        set $up_bkn_safe http://bkn-safe:3000;
        proxy_pass $up_bkn_safe;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /api/safe/v1/permission-requests {
        set $up_bkn_safe http://bkn-safe:3000;
        proxy_pass $up_bkn_safe;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /api/safe/v1/capabilities {
        set $up_bkn_safe http://bkn-safe:3000;
        proxy_pass $up_bkn_safe;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    location /oauth2 {
        set $up_hydra http://bkn-safe-hydra-public:4444;
        proxy_pass $up_hydra;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /.well-known/openid-configuration {
        set $up_hydra http://bkn-safe-hydra-public:4444;
        proxy_pass $up_hydra;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /.well-known/jwks.json {
        set $up_hydra http://bkn-safe-hydra-public:4444;
        proxy_pass $up_hydra;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    location /userinfo {
        set $up_hydra http://bkn-safe-hydra-public:4444;
        proxy_pass $up_hydra;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    # 运行时配置必须不缓存，否则改了 mode 后浏览器仍用旧配置。
    location = /studio/config.js {
        set $up_studio http://studio:80;
        proxy_pass $up_studio;
        include /etc/nginx/conf.d/proxy-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /studio/assets/ {
        set $up_studio http://studio:80;
        proxy_pass $up_studio;
        include /etc/nginx/conf.d/proxy-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /studio/ {
        set $up_studio http://studio:80;
        proxy_pass $up_studio;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
}
